<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VibeBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: radial-gradient(circle at top left, #7c3aed 18%, #2563eb 42%, #0f1720 100%);
      color:#f8fafc;line-height:1.45;-webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:auto;
    }

    /* App layout: centered column with whitespace */
    .page{
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .container{
      width:100%;max-width:980px;min-height:calc(100vh - 48px);background:rgba(15,23,42,0.96);border-radius:24px;box-shadow:0 24px 80px rgba(15,23,42,.35);
      display:grid;grid-template-columns:240px 1fr;overflow:hidden;border:1px solid rgba(148,163,184,.18);
    }

    /* Sidebar (collapsible) */
    .sidebar{
      background:rgba(15,23,42,0.92);border-right:1px solid rgba(148,163,184,.18);padding:20px;display:flex;flex-direction:column;gap:16px;
      transition:width .22s ease;min-width:76px}
    .sidebar.collapsed{width:76px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700;color:#e2e8f0}
    .brand-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#22d3ee);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.04em;}
    .sidebar .spacer{flex:1}
    .icon-btn{width:40px;height:40px;border-radius:12px;border:none;background:rgba(71,85,105,.14);display:inline-flex;align-items:center;justify-content:center;color:#cbd5e1;cursor:pointer;transition:transform .2s ease,background .2s ease}
    .icon-btn:hover{transform:translateY(-1px);background:rgba(124,58,237,.18)}

    /* Main area */
    .main{
      display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;background:linear-gradient(180deg,rgba(15,23,42,.75),rgba(15,23,42,.98));padding:22px 24px;min-height:0;height:100%;
    }

    /* Chat area */
    .chat-wrap{flex:1 1 auto;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:18px;min-height:0;}
    .chat-wrap::-webkit-scrollbar{width:8px}
    .chat-wrap::-webkit-scrollbar-thumb{background:rgba(148,163,184,.4);border-radius:999px}
    .chat-wrap::-webkit-scrollbar-track{background:transparent}
    .welcome{max-width:560px;margin:auto;text-align:center;color:#e2e8f0}
    .welcome h2{font-size:28px;margin-bottom:12px;letter-spacing:.02em;color:#fff;text-shadow:0 6px 20px rgba(124,58,237,.25)}
    .welcome p{font-size:15px;color:#cbd5e1;margin-bottom:16px}

    /* Messages */
    .msg{display:flex;gap:12px;align-items:flex-end;max-width:78%;animation:fadeIn .28s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .msg.bot{align-self:flex-start}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .avatar{width:40px;height:40px;border-radius:14px;background:rgba(148,163,184,.14);display:flex;align-items:center;justify-content:center;color:#f8fafc;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.12)}
    .bubble{padding:14px 16px;border-radius:18px;background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.18);color:#e2e8f0;box-shadow:0 18px 36px rgba(15,23,42,.18);font-size:15px;backdrop-filter:blur(14px)}
    .msg.user .bubble{background:linear-gradient(135deg,#7c3aed,#22d3ee);color:#fff;border:none;box-shadow:0 18px 36px rgba(34,211,238,.22)}

    /* metadata tags */
    .meta{display:flex;gap:8px;margin-top:10px;font-size:12px;color:#cbd5e1}
    .tag{padding:8px 10px;border-radius:999px;background:rgba(71,85,105,.15);border:1px solid rgba(148,163,184,.22);color:#f8fafc;font-size:13px;cursor:pointer;transition:transform .2s ease,background .2s ease}
    .tag:hover{transform:translateY(-1px);background:rgba(124,58,237,.18)}

    /* typing indicator */
    .typing{display:inline-flex;gap:6px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(148,163,184,.15);color:#f8fafc}
    .dot{width:6px;height:6px;background:#a78bfa;border-radius:50%;opacity:.9;animation:dot 1s infinite}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes dot{0%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(0)}100%{transform:translateY(0)}}

    /* Input bar sticky */
    .input-area{padding:18px 20px;border-top:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.95);backdrop-filter:blur(10px)}
    .input-row{display:flex;gap:12px;align-items:center}
    .composer{flex:1;background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.22);padding:14px 16px;border-radius:18px;box-shadow:0 16px 38px rgba(15,23,42,.16);min-height:52px;display:flex;align-items:center;gap:10px}
    .composer textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-size:15px;color:#f8fafc;line-height:1.5}
    .composer textarea::placeholder{color:rgba(226,232,240,.7)}
    .actions{display:flex;gap:10px}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:none;background:rgba(71,85,105,.22);color:#f8fafc;padding:10px 12px;border-radius:14px;cursor:pointer;transition:transform .2s ease,background .2s ease}
    .btn:hover{transform:translateY(-1px);background:rgba(124,58,237,.26)}
    .send{background:linear-gradient(135deg,#7c3aed,#22d3ee);color:#fff;padding:12px 14px;border-radius:16px;box-shadow:0 16px 50px rgba(34,211,238,.18)}

    /* responsive */
    @media (max-width:880px){.container{grid-template-columns:72px 1fr;height:92vh}.sidebar{display:flex}.sidebar.collapsed{display:none}}
    @media (max-width:520px){.container{max-width:100%;height:100vh;border-radius:0;padding:0}.chat-wrap{padding:12px}}

    /* small helpers */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="page">
    <div class="container" role="application">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-icon">V</div>
          <div class="brand-name">VibeBot</div>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="toggleSidebar" aria-label="Toggle sidebar">
          <!-- simple chevron -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L4.21 4.21A2 2 0 0 1 7 1.38l.06.06A1.65 1.65 0 0 0 8.88 1a1.65 1.65 0 0 0 1 1.51H10a2 2 0 0 1 4 0h.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06A2 2 0 0 1 20.62 4.2l-.06.06a1.65 1.65 0 0 0-.33 1.82V8a2 2 0 0 1 0 4h-.09c-.7 0-1.3.46-1.51 1z"></path></svg>
        </button>
      </aside>

      <main class="main">
        <div class="chat-wrap" id="chatWindow">
          <div class="welcome" id="welcome">
            <h2>What’s good? I’m VibeBot.</h2>
            <p>Spill the tea, ask for a mood check, or flex a question — I’ll keep it chill and real.</p>
            <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center">
              <button class="tag" onclick="sendStarter(this)">Spill the tea</button>
              <button class="tag" onclick="sendStarter(this)">Vibe check this</button>
              <button class="tag" onclick="sendStarter(this)">Explain it plz</button>
            </div>
          </div>
        </div>

        <div class="input-area">
          <div class="input-row">
            <div class="composer" role="textbox" aria-label="Message composer">
              <textarea id="msgInput" rows="1" placeholder="Say hey to VibeBot…" ></textarea>
            </div>
            <div class="actions">
              <button class="btn" id="attachBtn" title="Attach">📎</button>
              <button class="send" id="sendBtn" title="Send">➤</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Basic chat interactions preserved; UI-focused script
    const chatWindow = document.getElementById('chatWindow');
    const msgInput = document.getElementById('msgInput');
    const welcome = document.getElementById('welcome');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');

    let isTyping = false;
    let currentMode = 'default';

    // Toggle sidebar
    toggleSidebar.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // Auto-resize
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 180) + 'px';
    });

    // Send handlers
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function sendStarter(el){ msgInput.value = el.textContent.trim(); sendMessage(); }

    function appendBubble(text, role='bot', meta){ if (welcome) welcome.style.display='none';
      const msg = document.createElement('div'); msg.className = 'msg ' + role;
      const avatar = document.createElement('div'); avatar.className='avatar'; avatar.textContent = role==='bot'?'V':'You';
      const bubbleWrap = document.createElement('div');
      const bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent = text;
      bubbleWrap.appendChild(bubble);
      if (meta && role==='bot'){ const metaRow=document.createElement('div'); metaRow.className='meta'; if(meta.intent) metaRow.appendChild(tag('#'+meta.intent)); if(meta.emotion) metaRow.appendChild(tag(meta.emotion)); bubbleWrap.appendChild(metaRow); }
      msg.appendChild(avatar); msg.appendChild(bubbleWrap); chatWindow.appendChild(msg); chatWindow.scrollTop = chatWindow.scrollHeight; return msg;
    }
    function tag(t){ const s=document.createElement('div'); s.className='tag'; s.textContent=t; return s; }

    function showTyping(){ const msg=document.createElement('div'); msg.className='msg bot'; msg.id='typing-indicator'; const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent='🤖'; const bubble=document.createElement('div'); bubble.className='typing'; bubble.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>'; msg.appendChild(avatar); msg.appendChild(bubble); chatWindow.appendChild(msg); chatWindow.scrollTop = chatWindow.scrollHeight; }
    function removeTyping(){ const t=document.getElementById('typing-indicator'); if(t) t.remove(); }

    async function sendMessage(){ const text = msgInput.value.trim(); if(!text || isTyping) return; msgInput.value=''; msgInput.style.height='auto'; appendBubble(text,'user'); isTyping=true; showTyping();
      try{
        const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:currentMode})});
        const data = await res.json(); await new Promise(r=>setTimeout(r,200+Math.random()*400)); removeTyping(); appendBubble(data.response||'Sorry, no response','bot',{emotion:data.emotion,intent:data.intent,sentiment:data.sentiment});
      }catch(e){ removeTyping(); appendBubble('Something went wrong — please try again.','bot'); }
      isTyping=false;
    }
  </script>
</body>
</html>
