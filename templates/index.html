<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenZBot ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0725;
      --surface:   #110a2b;
      --surface2:  #120a2f;
      --border:    #2a2140;
      --accent:    #8b63ff;
      --accent2:   #6f4bff;
      --text:      #efeefe;
      --muted:     #a99df0;
      --bot-bg:    #13081f;
      --radius:    14px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      overflow: hidden;
    }

    /* ─── Layout ────────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }

    /* ambient glow */
    .app::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,92,252,.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Header ────────────────────────────────────────────────── */
    .header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,.85);
      backdrop-filter: blur(16px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(124,92,252,.4);
    }
    .logo-text {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--accent2); }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent3);
      box-shadow: 0 0 8px var(--accent3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* ─── Mode selector ─────────────────────────────────────────── */
    .mode-bar {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 10px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .mode-bar::-webkit-scrollbar { display: none; }

    .mode-btn {
      flex-shrink: 0;
      padding: 5px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--text); }
    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px rgba(124,92,252,.4);
    }

    /* ─── Chat window ───────────────────────────────────────────── */
    .chat-window {
      position: relative;
      z-index: 5;
      overflow-y: auto;
      padding: 24px 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* ─── Bubbles ───────────────────────────────────────────────── */
    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp .3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user  { flex-direction: row-reverse; }
    .msg.bot   { flex-direction: row; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .msg.bot  .avatar { background: var(--bot-bg); border: 1px solid var(--border); }
    .msg.user .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    .bubble {
      max-width: 72%;
      padding: 11px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 14.5px;
      position: relative;
    }
    .msg.bot  .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, #7c5cfc, #fc5c8a);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .meta-tags {
      display: flex;
      gap: 5px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 100px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: .3px;
    }
    .tag.emotion  { border-color: #7c5cfc44; color: #a98aff; }
    .tag.sentiment{ border-color: #5cfcd844; color: #5cfcd8; }
    .tag.intent   { border-color: #fc5c8a44; color: #ff8aaa; }

    /* typing indicator */
    .typing-bubble .dot {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      display: inline-block;
      animation: bounce .9s infinite;
    }
    .typing-bubble .dot:nth-child(2) { animation-delay: .15s; }
    .typing-bubble .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }
    .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 14px 18px; }

    /* ─── Input bar ─────────────────────────────────────────────── */
    .input-bar {
      position: relative;
      z-index: 10;
      padding: 14px 20px 18px;
      background: rgba(10,10,15,.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,252,.15); }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14.5px;
      resize: none;
      min-height: 24px;
      max-height: 100px;
      line-height: 1.5;
    }
    #msgInput::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity .2s, transform .1s;
      box-shadow: 0 2px 12px rgba(124,92,252,.4);
    }
    .send-btn:hover { opacity: .9; transform: scale(1.04); }
    .send-btn:active { transform: scale(.97); }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ─── Welcome card ──────────────────────────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 40px 20px 20px;
      animation: fadeUp .4s ease both;
    }
    .welcome-icon { font-size: 44px; }
    .welcome h2 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
    }
    .welcome p { color: var(--muted); font-size: 13.5px; max-width: 340px; line-height: 1.6; }

    .starters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }
    .starter {
      padding: 7px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 12.5px;
      cursor: pointer;
      transition: all .2s;
    }
    .starter:hover {
      border-color: var(--accent);
      background: rgba(124,92,252,.1);
      color: #a98aff;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">💜</div>
      <div class="logo-text">Vibe</div>
    </div>
    <div style="width:8px"></div>
  </header>

  <!-- Mode bar -->
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="vibe">Vibe</button>
    <button class="mode-btn" data-mode="roast">Roast</button>
    <button class="mode-btn" data-mode="hype">Hype</button>
  </div>

  <!-- Chat window -->
  <main class="chat-window" id="chatWindow">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✨</div>
      <h2>Hey—I'm Vibe</h2>
      <p>short, human replies. pick a mode and I'll match the tone.</p>
      <div class="starters">
        <button class="starter" onclick="sendStarter(this)">what's up?</button>
        <button class="starter" onclick="sendStarter(this)">roast me</button>
        <button class="starter" onclick="sendStarter(this)">hype me up</button>
        <button class="starter" onclick="sendStarter(this)">vibe check</button>
      </div>
    </div>
  </main>

  <!-- Input bar -->
  <div class="input-bar">
    <div class="input-row">
      <textarea id="msgInput" placeholder="say something... fr 💬" rows="1"></textarea>
      <button class="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
    <p class="hint">GenZBot understands slang, emojis & acronyms 🔥</p>
  </div>

</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const msgInput   = document.getElementById('msgInput');
  const welcome    = document.getElementById('welcome');
  let currentMode  = 'default';
  let isTyping     = false;

  // ── Mode selector ───────────────────────────────────────────────────────
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    });
  });

  // ── Auto-resize textarea ────────────────────────────────────────────────
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
  });

  // ── Enter to send ───────────────────────────────────────────────────────
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Starter prompts ─────────────────────────────────────────────────────
  function sendStarter(el) {
    msgInput.value = el.textContent.trim();
    sendMessage();
  }

  // ── Append a bubble ─────────────────────────────────────────────────────
  function appendBubble(text, role, meta) {
    if (welcome) welcome.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'bot' ? '🤖' : '🧑';

    const right = document.createElement('div');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    right.appendChild(bubble);

    if (meta && role === 'bot') {
      const tags = document.createElement('div');
      tags.className = 'meta-tags';
      if (meta.emotion) {
        const t = document.createElement('span');
        t.className = 'tag emotion';
        t.textContent = '⚡ ' + meta.emotion;
        tags.appendChild(t);
      }
      if (meta.sentiment) {
        const t = document.createElement('span');
        t.className = 'tag sentiment';
        t.textContent = '◉ ' + meta.sentiment;
        tags.appendChild(t);
      }
      if (meta.intent) {
        const t = document.createElement('span');
        t.className = 'tag intent';
        t.textContent = '# ' + meta.intent;
        tags.appendChild(t);
      }
      right.appendChild(tags);
    }

    msg.appendChild(avatar);
    msg.appendChild(right);
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return msg;
  }

  // ── Typing indicator ────────────────────────────────────────────────────
  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-bubble';
    bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  // ── Send message ────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || isTyping) return;

    msgInput.value = '';
    msgInput.style.height = 'auto';

    appendBubble(text, 'user');

    isTyping = true;
    showTyping();

    // Inject mode hint into message (only vibe/roast/hype)
    let fullMessage = text;
    if (currentMode === 'roast') fullMessage = 'roast me: ' + text;
    if (currentMode === 'hype')  fullMessage = 'hype me up: ' + text;
    if (currentMode === 'vibe')  fullMessage = 'vibe: ' + text;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: fullMessage }),
      });
      const data = await res.json();

      // Small random delay for realism
      await new Promise(r => setTimeout(r, 300 + Math.random() * 400));

      removeTyping();
      appendBubble(data.response, 'bot', {
        emotion:   data.emotion,
        sentiment: data.sentiment,
        intent:    data.intent,
      });
    } catch (err) {
      removeTyping();
      appendBubble("oop, something broke on my end 😅 try again?", 'bot');
    }

    isTyping = false;
  }
</script>
</body>
</html>
